name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check and test the library
        run: |
          moon update
          moon check --target wasm-gc
          moon test --target wasm-gc
      - name: Check and test the example workspace
        working-directory: moon_shadow_example
        run: |
          moon check --target wasm-gc
          moon test --target wasm-gc
      - name: Generated file must match `moon.mod` and the toolchain
        # `git_info()` is not compared. It records the commit that happened to
        # run the generator, so two builds can never agree on it — and a PR's
        # merge commit differs from the one its author generated from. What is
        # compared is everything else in the file: `module_info()` from
        # `moon.mod` and `build_info()` from the installed toolchain.
        run: |
          moon check
          for f in shadow/generated.mbt moon_shadow_example/shadow/generated.mbt; do
            git show "HEAD:$f" > /tmp/committed.mbt
            scripts/diff-generated.sh /tmp/committed.mbt "$f" || {
              echo "::error file=$f::generated file is stale; run moon check and commit"
              exit 1
            }
          done
      - name: The generator compiles for every target
        # No target-specific code is left in `gen`, so a target that did not
        # compile would mean a shim crept back in.
        run: |
          for target in js wasm-gc native; do
            moon check --target "$target" --target-dir "_build/gen-$target" gen
          done
