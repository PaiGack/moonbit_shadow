name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check and test the library
        run: |
          moon update
          moon check --target wasm-gc
          moon test --target wasm-gc
      - name: Check and test the example workspace
        working-directory: moon_shadow_example
        run: |
          moon check --target wasm-gc
          moon test --target wasm-gc
      - name: Generated `module_info` must match `moon.mod`
        # `git_info()` is a snapshot of the commit the file was generated from,
        # so it is *supposed* to drift — a clean checkout builds at a newer
        # commit than whatever was committed, and diffing the whole file would
        # fail on every push. `module_info()` has no such excuse: it is a pure
        # function of `moon.mod`, so only that half is compared.
        run: |
          strip_git_info() {
            sed '/^pub fn git_info()/,$d' "$1"
          }
          for f in shadow/generated.mbt moon_shadow_example/shadow/generated.mbt; do
            strip_git_info "$f" > /tmp/got.mbt
            strip_git_info <(git show "HEAD:$f") > /tmp/want.mbt
            diff -u /tmp/want.mbt /tmp/got.mbt || {
              echo "::error file=$f::module_info() is stale; run moon check and commit"
              exit 1
            }
          done
      - name: The generator itself must compile for the target it runs on
        run: |
          moon check --target js --target-dir _build/gen gen
