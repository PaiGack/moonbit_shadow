name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check and test the library
        run: |
          moon update
          moon check --target wasm-gc
          moon test --target wasm-gc
      - name: Check and test the example workspace
        working-directory: moon_shadow_example
        run: |
          moon check --target wasm-gc
          moon test --target wasm-gc
      - name: Generated file must match `moon.mod` and the checkout
        # Both halves are now deterministic: `module_info()` is a pure function
        # of `moon.mod`, and `git_info()` is read from this very checkout, so a
        # fresh clone reproduces the committed file byte for byte. Diffing the
        # whole file is what catches a generator that silently stops reading a
        # field.
        run: |
          moon check
          for f in shadow/generated.mbt moon_shadow_example/shadow/generated.mbt; do
            git show "HEAD:$f" > /tmp/want.mbt
            diff -u /tmp/want.mbt "$f" || {
              echo "::error file=$f::generated file is stale; run moon check and commit"
              exit 1
            }
          done
      - name: The generator compiles for every target
        # No target-specific code is left in `gen`, so a target that did not
        # compile would mean a shim crept back in.
        run: |
          for target in js wasm-gc native; do
            moon check --target "$target" --target-dir "_build/gen-$target" gen
          done
