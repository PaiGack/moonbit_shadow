name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check and test the library
        run: |
          moon check --target wasm-gc
          moon test --target wasm-gc
      - name: Check and test the example workspace
        working-directory: moon_shadow_example
        run: |
          moon check --target wasm-gc
          moon test --target wasm-gc
      - name: Generated implementations must be up to date
        run: |
          git diff --exit-code shadow/generated.mbt
          git diff --exit-code moon_shadow_example/shadow_impl/generated.mbt
